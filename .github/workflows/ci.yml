name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      # The race detector needs cgo and a C compiler. Windows dev machines
      # here have neither, so this is the only place -race actually runs.
      - name: Test with race detector
        run: go test -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.13.2
          working-directory: apps/api

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # The contract is only real if the committed code matches it. Regenerate
      # and fail on any diff, so api/openapi.yaml and the Go types cannot drift.
      - name: Verify generated code is up to date
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0
          oapi-codegen --config internal/api/config.yaml ../../api/openapi.yaml
          if ! git diff --exit-code -- internal/api/openapi.gen.go; then
            echo "::error::internal/api/openapi.gen.go is stale. Run 'make generate' and commit."
            exit 1
          fi

      # Same rule for the query code, and the source it is checked against is
      # the migrations themselves — sqlc reads internal/db/migrations, so a
      # query that names a column a migration removed fails HERE rather than in
      # a handler nobody has written yet.
      - name: Verify sqlc output is up to date
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc generate
          if ! git diff --exit-code -- internal/db/sqlcgen; then
            echo "::error::internal/db/sqlcgen is stale. Run 'make generate' and commit."
            exit 1
          fi

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build

      - name: Verify generated types are up to date
        run: |
          npm run generate
          if ! git diff --exit-code -- src/api/schema.gen.ts; then
            echo "::error::src/api/schema.gen.ts is stale. Run 'make generate' and commit."
            exit 1
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
