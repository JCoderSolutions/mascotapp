# Devcontainer stack.
#
# The isolation boundary lives here, not in permission rules. Permission rules
# match command STRINGS, not their effects — a `make clean` that shells out to
# `rm -rf` is not blocked by any pattern. Only the container bounds what an
# agent can actually reach.
#
# The single most important line in this file is the bind mount below: ONLY the
# repository is mounted. C:\Users\Jose is never exposed. An agent running with
# bypassPermissions in here cannot touch the host.

services:
  workspace:
    image: mcr.microsoft.com/devcontainers/base:bookworm
    volumes:
      # The repository, and nothing else. Never widen this to a parent path.
      - ..:/workspace:cached
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mascotapp:mascotapp_local_only@postgres:5432/mascotapp?sslmode=disable
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: mascotapp
      S3_SECRET_KEY: mascotapp_local_only
      S3_BUCKET: mascotapp-media

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mascotapp
      POSTGRES_PASSWORD: mascotapp_local_only
      POSTGRES_DB: mascotapp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mascotapp -d mascotapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mascotapp
      MINIO_ROOT_PASSWORD: mascotapp_local_only
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  minio-data:
